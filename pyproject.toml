[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "edp-events"
version = "0.2.0"
description = "SDK de eventos da plataforma de dados event-driven: CloudEvents, JSON Schema, Transactional Outbox e publisher para Event Hubs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "sqlalchemy>=2.0,<3",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
# Publisher para Azure Event Hubs com Entra ID (Workload Identity).
eventhubs = [
  "azure-eventhub>=5.12,<6",
  "azure-identity>=1.19,<2",
  "azure-schemaregistry>=1.3,<2",
]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/edp_events"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
